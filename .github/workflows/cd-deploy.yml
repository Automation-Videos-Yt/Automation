name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Change to match your target region

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Execute deployment via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["export HOME=/root","cd /home/ubuntu","export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}","rm -rf ai_automation_videos_tmp","git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git ai_automation_videos_tmp","mkdir -p ai_automation_videos","cp -a ai_automation_videos_tmp/. ai_automation_videos/","rm -rf ai_automation_videos_tmp","chown -R ubuntu:ubuntu ai_automation_videos","cd ai_automation_videos","echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.actor }} --password-stdin","export DOCKERHUB_NAMESPACE=ghcr.io/${{ env.OWNER_LC }}","export IMAGE_TAG=latest","docker compose -f docker-compose.prod.yml pull","docker compose -f docker-compose.prod.yml up -d","docker image prune -f"]' \
            --comment "Deploy latest docker images"
