name: CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-api:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-web:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-web:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-worker:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-worker:${{ github.sha }}

      - name: Build and push ai image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ai
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-ai:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-ai:${{ github.sha }}
