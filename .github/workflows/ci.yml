name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Node side: install once, then typecheck api + worker, lint + build web
  # ──────────────────────────────────────────────────────────────────────────
  node:
    name: Node (typecheck · lint · web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npm --workspace apps/api run prisma:generate

      - name: Typecheck api
        run: npx --workspace apps/api tsc -p tsconfig.json --noEmit

      - name: Typecheck worker
        run: npx --workspace apps/worker tsc -p tsconfig.json --noEmit

      - name: Lint web (next lint)
        run: npm --workspace apps/web run lint

      - name: Build web
        run: npm --workspace apps/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  # ──────────────────────────────────────────────────────────────────────────
  # Prisma schema sanity
  # ──────────────────────────────────────────────────────────────────────────
  prisma-schema:
    name: Prisma schema (validate · format)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install api workspace
        run: npm ci --no-audit --no-fund --workspace apps/api

      - name: Validate schema
        run: npx --workspace apps/api prisma validate

      - name: Format check
        run: npx --workspace apps/api prisma format --check

  # ──────────────────────────────────────────────────────────────────────────
  # Python side: ruff (critical-set lint) + pydantic schema sanity via compile
  # ──────────────────────────────────────────────────────────────────────────
  python:
    name: Python (ruff · compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Ruff (critical)
        run: ruff check --select=E9,F63,F7,F82 ai-system

      - name: Compile-check every .py file
        run: python -m compileall -q ai-system

      - name: Install runtime deps
        run: pip install -r ai-system/requirements.txt

      - name: Import Pydantic schemas
        working-directory: ai-system
        run: python -c "import schemas; print(schemas.__all__)"

  # ──────────────────────────────────────────────────────────────────────────
  # GHCR Docker Build & Push
  # ──────────────────────────────────────────────────────────────────────────
  build-push-ghcr:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [node, prisma-schema, python]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-api:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-web:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-web:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-worker:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-worker:${{ github.sha }}

      - name: Build and push ai image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ai
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/automation-ai:latest
            ghcr.io/${{ env.OWNER_LC }}/automation-ai:${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────────────
  # Aggregated status check
  # ──────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [node, prisma-schema, python, build-push-ghcr]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed."
            exit 1
          fi
          echo "All checks passed."
