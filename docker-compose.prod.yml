services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_automation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-youtube_automation}"]
      interval: 5s
      timeout: 5s
      retries: 15

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      STORAGE_PATH: /storage
      APP_S3_BUCKET: ${APPLICATION_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      API_PORT: 4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: automation-api
    volumes:
      - storage_data:/storage
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run prisma:deploy && npm start"

  worker:
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      STORAGE_PATH: /storage
      APP_S3_BUCKET: ${APPLICATION_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      WORKER_ROLE: all
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: automation-worker
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      ai:
        condition: service_started

  # Optional split workers. Start them with:
  # docker compose -f docker-compose.prod.yml --profile split-workers up -d worker-video worker-upload worker-enrichment
  # (and stop the default `worker` service when using split mode)
  worker-video:
    profiles: ["split-workers"]
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      STORAGE_PATH: /storage
      APP_S3_BUCKET: ${APPLICATION_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      WORKER_ROLE: video
      ENABLE_ANALYTICS_CRON: "false"
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      ai:
        condition: service_started

  worker-upload:
    profiles: ["split-workers"]
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      STORAGE_PATH: /storage
      APP_S3_BUCKET: ${APPLICATION_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      WORKER_ROLE: upload
      ENABLE_ANALYTICS_CRON: "false"
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      ai:
        condition: service_started

  worker-enrichment:
    profiles: ["split-workers"]
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_automation}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      STORAGE_PATH: /storage
      APP_S3_BUCKET: ${APPLICATION_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      WORKER_ROLE: enrichment
      ENABLE_ANALYTICS_CRON: "true"
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      ai:
        condition: service_started

  ai:
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_PATH: /storage
    volumes:
      - storage_data:/storage

  web:
    image: ${DOCKERHUB_NAMESPACE:-hardik18hk19}/automation-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-13.207.169.204.nip.io}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  pg-backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: unless-stopped
    environment:
      SCHEDULE: '@daily'
      S3_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: https://s3.${AWS_REGION:-us-east-1}.amazonaws.com
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      S3_PREFIX: 'backup'
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${POSTGRES_DB:-youtube_automation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

  otel-collector:
    image: otel/opentelemetry-collector:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
