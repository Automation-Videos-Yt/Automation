server {
    listen 80;
    server_name _;

    # Route requests starting with /api to the backend API
    # Assuming API is accessible at / or /api internally. If the API itself expects /api, remove the trailing slash in proxy_pass.
    location /api/ {
        # The backend Express app might expect routes without the /api prefix, so we rewrite it.
        # Check Next.js NEXT_PUBLIC_API_URL usage. Usually, next uses full URL.
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to Next.js Frontend
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
